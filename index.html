<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoVisualizer - Interaktiver Lernmodus</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .array-box {
      /* Wir entfernen die statische transition, da Framer Motion das übernimmt */
    }
    .pointer-arrow {
      transition: all 0.3s ease;
    }
    .node-circle {
      transition: all 0.3s ease;
    }
    
    /* Animation für Swap */
    .swap-anim {
      animation: swap 0.5s ease-in-out;
    }
    @keyframes swap {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// --- FILE: utils.js ---
// utils.js

const generateRandomArray = (length = 10, max = 99) => {
  return Array.from({ length }, () => Math.floor(Math.random() * max) + 1);
};

const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

const arraysEqual = (a, b) => {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
};

// Deterministische Farbe für Pointernamen
const getPointerColor = (name) => {
  const colors = [
    'text-blue-600', 'text-red-600', 'text-green-600', 
    'text-purple-600', 'text-pink-600', 'text-orange-600', 
    'text-teal-600', 'text-cyan-600', 'text-indigo-600'
  ];
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return colors[Math.abs(hash) % colors.length];
};


// --- FILE: quiz_engine.js ---
// quiz_engine.js

const QuizPanel = ({ quiz, onCorrect, onSkip }) => {
  const [answer, setAnswer] = useState("");
  const [errorMsg, setErrorMsg] = useState("");

  if (!quiz) return null;

  const handleSubmit = () => {
    if (quiz.type === "INPUT_ARRAY") {
      const parsed = answer.split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
      if (arraysEqual(parsed, quiz.correctAnswer)) {
        setErrorMsg("");
        setAnswer("");
        onCorrect();
      } else {
        setErrorMsg(`Falsch. ${quiz.explanation}`);
      }
    } else if (quiz.type === "MULTIPLE_CHOICE") {
      if (answer === quiz.correctAnswer) {
        setErrorMsg("");
        setAnswer("");
        onCorrect();
      } else {
        setErrorMsg(`Falsch. ${quiz.explanation}`);
      }
    }
  };

  return (
    <div className="bg-white/70 backdrop-blur-md p-6 rounded-2xl shadow-2xl border-l-4 border-yellow-500 border-t border-r border-b border-white/50 w-80 flex-shrink-0 relative">
      <div className="absolute -top-3 -left-3 bg-gradient-to-br from-yellow-400 to-yellow-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold shadow-lg">?</div>
      <h3 className="text-xl font-extrabold text-slate-800 mb-2">Klausur-Frage!</h3>
      <p className="text-slate-700 mb-4 text-sm font-medium">{quiz.question}</p>
      
      {quiz.type === "INPUT_ARRAY" && (
        <input 
          type="text" 
          placeholder="z.B. 5, 2, 9, 1" 
          value={answer}
          onChange={(e) => setAnswer(e.target.value)}
          className="w-full border border-gray-300 p-2 rounded-xl mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white/80"
        />
      )}

      {quiz.type === "MULTIPLE_CHOICE" && (
        <div className="flex flex-col space-y-3 mb-4">
          {quiz.options.map((opt, idx) => (
            <label key={idx} className="flex items-center space-x-3 text-sm cursor-pointer p-2 rounded-lg hover:bg-white/50 transition-colors">
              <input 
                type="radio" 
                name="quiz_option" 
                value={opt} 
                checked={answer === opt}
                onChange={() => setAnswer(opt)}
                className="form-radio h-4 w-4 text-indigo-600 focus:ring-indigo-500"
              />
              <span className="font-medium text-slate-700">{opt}</span>
            </label>
          ))}
        </div>
      )}

      {errorMsg && (
        <div className="text-red-700 text-sm mb-3 bg-red-100/80 p-3 rounded-lg border border-red-200 shadow-inner">
          {errorMsg}
        </div>
      )}

      <div className="flex flex-col gap-2 mt-4">
        <button 
          onClick={handleSubmit}
          className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-2 px-4 rounded-xl shadow-lg transition-all transform hover:scale-105"
        >
          Antwort prüfen
        </button>
        <button 
          onClick={() => {
            setErrorMsg("");
            setAnswer("");
            if(onSkip) onSkip();
          }}
          className="w-full text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 font-semibold py-2 px-4 rounded-xl transition-colors text-sm"
        >
          Überspringen
        </button>
      </div>
    </div>
  );
};


// --- FILE: tree_algos.js ---
// tree_algos.js

const createInitialTreeState = () => ({
  nodes: { "NIL": { val: "NIL", color: "black", left: null, right: null, parent: null, isSentinel: true } },
  rootId: "NIL", pointers: {}, conflict: null, explanation: "Baum initialisiert."
});

// --- BST SEARCH ---
function* bstSearchSteps(values) {
  let state = createInitialTreeState();
  // Build tree silently first
  let nextId = 1;
  const bstInsertSilent = (val) => {
    let z = `node_${nextId++}`;
    state.nodes[z] = { val: val, color: "blue", left: "NIL", right: "NIL", parent: "NIL" };
    let y = "NIL"; let x = state.rootId;
    while (x !== "NIL") { y = x; x = val < state.nodes[x].val ? state.nodes[x].left : state.nodes[x].right; }
    state.nodes[z].parent = y;
    if (y === "NIL") state.rootId = z;
    else if (val < state.nodes[y].val) state.nodes[y].left = z;
    else state.nodes[y].right = z;
  };
  
  let treeVals = values.slice(0, values.length - 1);
  let searchVal = values[values.length - 1];
  treeVals.forEach(bstInsertSilent);
  
  yield { ...deepClone(state), explanation: `Baum aufgebaut. Suche nach Wert: ${searchVal}.` };
  
  let x = state.rootId;
  while (x !== "NIL" && state.nodes[x].val !== searchVal) {
    yield { ...deepClone(state), pointers: { x }, explanation: `x = ${state.nodes[x].val}. ${searchVal} ${searchVal < state.nodes[x].val ? '<' : '>='} ${state.nodes[x].val}. Gehe ${searchVal < state.nodes[x].val ? 'links' : 'rechts'}.` };
    x = searchVal < state.nodes[x].val ? state.nodes[x].left : state.nodes[x].right;
  }
  
  if (x === "NIL") {
    yield { ...deepClone(state), pointers: { x }, explanation: `x ist NIL. Wert ${searchVal} nicht gefunden.` };
  } else {
    yield { ...deepClone(state), pointers: { x, 'Gefunden': x }, explanation: `Wert ${searchVal} gefunden!` };
  }
}

// --- BST INSERT --- (from before, compressed)
function* bstInsertSteps(values) {
  let state = createInitialTreeState();
  let nextId = 1;
  
  for (let val of values) {
    let z = `node_${nextId++}`;
    state.nodes[z] = { val: val, color: "blue", left: "NIL", right: "NIL", parent: "NIL" };
    
    let y = "NIL"; let x = state.rootId;
    yield { ...deepClone(state), pointers: { z, x }, explanation: `Einfügen: ${val}. Starte an Wurzel.` };

    while (x !== "NIL") {
      y = x;
      let goLeft = val < state.nodes[x].val;
      yield { ...deepClone(state), pointers: { z, y, x }, explanation: `${val} ${goLeft ? '<' : '>='} ${state.nodes[x].val}. Gehe ${goLeft ? 'links' : 'rechts'}.` };
      x = goLeft ? state.nodes[x].left : state.nodes[x].right;
    }

    state.nodes[z].parent = y;
    if (y === "NIL") {
      state.rootId = z;
    } else if (val < state.nodes[y].val) {
      state.nodes[y].left = z;
    } else {
      state.nodes[y].right = z;
    }
    
    yield { ...deepClone(state), pointers: { z, y }, explanation: `Knoten ${val} als Kind von ${y !== 'NIL' ? state.nodes[y].val : 'NIL'} eingefügt.` };
  }
}

// --- RBT INSERT (Compressed & Merged steps) ---
function* rbtInsertSteps(values) {
  let state = createInitialTreeState();
  let nextId = 1;

  function* leftRotate(x) {
    let y = state.nodes[x].right;
    state.nodes[x].right = state.nodes[y].left;
    if (state.nodes[y].left !== "NIL") state.nodes[state.nodes[y].left].parent = x;
    state.nodes[y].parent = state.nodes[x].parent;
    if (state.nodes[x].parent === "NIL") state.rootId = y;
    else if (x === state.nodes[state.nodes[x].parent].left) state.nodes[state.nodes[x].parent].left = y;
    else state.nodes[state.nodes[x].parent].right = y;
    state.nodes[y].left = x; state.nodes[x].parent = y;
    yield { ...deepClone(state), pointers: { x, y }, explanation: `Left-Rotate an Knoten ${state.nodes[x].val} ausgeführt.` };
  }

  function* rightRotate(x) {
    let y = state.nodes[x].left;
    state.nodes[x].left = state.nodes[y].right;
    if (state.nodes[y].right !== "NIL") state.nodes[state.nodes[y].right].parent = x;
    state.nodes[y].parent = state.nodes[x].parent;
    if (state.nodes[x].parent === "NIL") state.rootId = y;
    else if (x === state.nodes[state.nodes[x].parent].right) state.nodes[state.nodes[x].parent].right = y;
    else state.nodes[state.nodes[x].parent].left = y;
    state.nodes[y].right = x; state.nodes[x].parent = y;
    yield { ...deepClone(state), pointers: { x, y }, explanation: `Right-Rotate an Knoten ${state.nodes[x].val} ausgeführt.` };
  }

  function* rbInsertFixup(z) {
    while (state.nodes[state.nodes[z].parent].color === "red") {
      let p = state.nodes[z].parent;
      let pp = state.nodes[p].parent;
      
      yield { 
        ...deepClone(state), pointers: { z, p, pp }, conflict: { nodeA: z, nodeB: p },
        explanation: `Regel E4 verletzt (Rot-Rot Konflikt)!`
      };

      if (p === state.nodes[pp].left) {
        let y = state.nodes[pp].right;
        if (state.nodes[y].color === "red") {
          state.nodes[p].color = "black"; state.nodes[y].color = "black"; state.nodes[pp].color = "red"; z = pp;
          yield { ...deepClone(state), pointers: { z }, explanation: `Fall 1: Tante rot. Umfärben von p, y und pp. z rückt auf.` };
        } else {
          if (z === state.nodes[p].right) {
            z = p; yield* leftRotate(z); p = state.nodes[z].parent; pp = state.nodes[p].parent;
          }
          state.nodes[p].color = "black"; state.nodes[pp].color = "red";
          yield* rightRotate(pp);
        }
      } else {
        let y = state.nodes[pp].left;
        if (state.nodes[y].color === "red") {
          state.nodes[p].color = "black"; state.nodes[y].color = "black"; state.nodes[pp].color = "red"; z = pp;
          yield { ...deepClone(state), pointers: { z }, explanation: `Fall 1: Tante rot. Umfärben von p, y und pp. z rückt auf.` };
        } else {
          if (z === state.nodes[p].left) {
            z = p; yield* rightRotate(z); p = state.nodes[z].parent; pp = state.nodes[p].parent;
          }
          state.nodes[p].color = "black"; state.nodes[pp].color = "red";
          yield* leftRotate(pp);
        }
      }
    }
    state.nodes[state.rootId].color = "black";
    yield { ...deepClone(state), pointers: {}, explanation: `E2 (Wurzel schwarz) sichergestellt. Fixup beendet.` };
  }

  for (let val of values) {
    let z = `node_${nextId++}`;
    state.nodes[z] = { val: val, color: "red", left: "NIL", right: "NIL", parent: "NIL" };
    let y = "NIL"; let x = state.rootId;
    while (x !== "NIL") { y = x; x = val < state.nodes[x].val ? state.nodes[x].left : state.nodes[x].right; }
    state.nodes[z].parent = y;
    if (y === "NIL") state.rootId = z;
    else if (val < state.nodes[y].val) state.nodes[y].left = z;
    else state.nodes[y].right = z;
    
    yield { ...deepClone(state), pointers: { z }, explanation: `Knoten ${val} rot eingefügt.` };
    yield* rbInsertFixup(z);
  }
}

// --- BST DELETE ---
function* bstDeleteSteps(values) {
  let state = createInitialTreeState();
  let nextId = 1;
  const bstInsertSilent = (val) => {
    let z = `node_${nextId++}`;
    state.nodes[z] = { val: val, color: "blue", left: "NIL", right: "NIL", parent: "NIL" };
    let y = "NIL"; let x = state.rootId;
    while (x !== "NIL") { y = x; x = val < state.nodes[x].val ? state.nodes[x].left : state.nodes[x].right; }
    state.nodes[z].parent = y;
    if (y === "NIL") state.rootId = z;
    else if (val < state.nodes[y].val) state.nodes[y].left = z;
    else state.nodes[y].right = z;
  };
  
  let treeVals = values.slice(0, values.length - 1);
  let deleteVal = values[values.length - 1];
  treeVals.forEach(bstInsertSilent);
  
  yield { ...deepClone(state), explanation: `Baum aufgebaut. Suche und lösche Wert: ${deleteVal}.` };
  
  let z = state.rootId;
  while (z !== "NIL" && state.nodes[z].val !== deleteVal) {
    z = deleteVal < state.nodes[z].val ? state.nodes[z].left : state.nodes[z].right;
  }
  
  if (z === "NIL") {
    yield { ...deepClone(state), explanation: `Wert ${deleteVal} nicht gefunden. Löschen abgebrochen.` };
    return;
  }
  
  yield { ...deepClone(state), pointers: { z }, explanation: `Knoten ${deleteVal} zum Löschen gefunden.` };

  function* transplant(u, v) {
    yield { ...deepClone(state), pointers: { u, v }, explanation: `Transplant: Ersetze Teilbaum u durch Teilbaum v.` };
    if (state.nodes[u].parent === "NIL") state.rootId = v;
    else if (u === state.nodes[state.nodes[u].parent].left) state.nodes[state.nodes[u].parent].left = v;
    else state.nodes[state.nodes[u].parent].right = v;
    if (v !== "NIL") state.nodes[v].parent = state.nodes[u].parent;
  }

  function* treeMinimum(x) {
    while (state.nodes[x].left !== "NIL") {
      x = state.nodes[x].left;
    }
    return x;
  }

  if (state.nodes[z].left === "NIL") {
    yield { ...deepClone(state), pointers: { z }, explanation: `Fall 1: Knoten hat kein linkes Kind. Ersetze durch rechtes Kind.` };
    yield* transplant(z, state.nodes[z].right);
  } else if (state.nodes[z].right === "NIL") {
    yield { ...deepClone(state), pointers: { z }, explanation: `Fall 2: Knoten hat kein rechtes Kind. Ersetze durch linkes Kind.` };
    yield* transplant(z, state.nodes[z].left);
  } else {
    yield { ...deepClone(state), pointers: { z }, explanation: `Fall 3: Knoten hat zwei Kinder. Suche Successor (Minimum im rechten Teilbaum).` };
    let y = yield* treeMinimum(state.nodes[z].right);
    yield { ...deepClone(state), pointers: { z, 'y (succ)': y }, explanation: `Successor y gefunden: ${state.nodes[y].val}.` };
    
    if (state.nodes[y].parent !== z) {
      yield { ...deepClone(state), pointers: { z, y }, explanation: `y ist nicht direktes Kind von z. Ersetze y durch y.right.` };
      yield* transplant(y, state.nodes[y].right);
      state.nodes[y].right = state.nodes[z].right;
      state.nodes[state.nodes[y].right].parent = y;
    }
    
    yield { ...deepClone(state), pointers: { z, y }, explanation: `Ersetze z durch y.` };
    yield* transplant(z, y);
    state.nodes[y].left = state.nodes[z].left;
    state.nodes[state.nodes[y].left].parent = y;
  }
  
  delete state.nodes[z];
  yield { ...deepClone(state), pointers: {}, explanation: `Knoten ${deleteVal} erfolgreich gelöscht.` };
}

// --- RBT DELETE (Simplified Visualization) ---
function* rbtDeleteSteps(values) {
  let state = createInitialTreeState();
  let nextId = 1;
  const rbtInsertSilent = (val) => {
    let z = `node_${nextId++}`;
    state.nodes[z] = { val: val, color: "red", left: "NIL", right: "NIL", parent: "NIL" };
    let y = "NIL"; let x = state.rootId;
    while (x !== "NIL") { y = x; x = val < state.nodes[x].val ? state.nodes[x].left : state.nodes[x].right; }
    state.nodes[z].parent = y;
    if (y === "NIL") state.rootId = z;
    else if (val < state.nodes[y].val) state.nodes[y].left = z;
    else state.nodes[y].right = z;
    
    // Quick Fixup silently
    while (state.nodes[state.nodes[z].parent].color === "red") {
      let p = state.nodes[z].parent; let pp = state.nodes[p].parent;
      if (p === state.nodes[pp].left) {
        let u = state.nodes[pp].right;
        if (state.nodes[u].color === "red") {
          state.nodes[p].color = "black"; state.nodes[u].color = "black"; state.nodes[pp].color = "red"; z = pp;
        } else {
          if (z === state.nodes[p].right) {
            z = p; 
            let yRot = state.nodes[z].right; state.nodes[z].right = state.nodes[yRot].left;
            if (state.nodes[yRot].left !== "NIL") state.nodes[state.nodes[yRot].left].parent = z;
            state.nodes[yRot].parent = state.nodes[z].parent;
            if (state.nodes[z].parent === "NIL") state.rootId = yRot;
            else if (z === state.nodes[state.nodes[z].parent].left) state.nodes[state.nodes[z].parent].left = yRot;
            else state.nodes[state.nodes[z].parent].right = yRot;
            state.nodes[yRot].left = z; state.nodes[z].parent = yRot;
            p = state.nodes[z].parent; pp = state.nodes[p].parent;
          }
          state.nodes[p].color = "black"; state.nodes[pp].color = "red";
          let yRot = state.nodes[pp].left; state.nodes[pp].left = state.nodes[yRot].right;
          if (state.nodes[yRot].right !== "NIL") state.nodes[state.nodes[yRot].right].parent = pp;
          state.nodes[yRot].parent = state.nodes[pp].parent;
          if (state.nodes[pp].parent === "NIL") state.rootId = yRot;
          else if (pp === state.nodes[state.nodes[pp].parent].right) state.nodes[state.nodes[pp].parent].right = yRot;
          else state.nodes[state.nodes[pp].parent].left = yRot;
          state.nodes[yRot].right = pp; state.nodes[pp].parent = yRot;
        }
      } else {
        let u = state.nodes[pp].left;
        if (state.nodes[u].color === "red") {
          state.nodes[p].color = "black"; state.nodes[u].color = "black"; state.nodes[pp].color = "red"; z = pp;
        } else {
          if (z === state.nodes[p].left) {
            z = p;
            let yRot = state.nodes[z].left; state.nodes[z].left = state.nodes[yRot].right;
            if (state.nodes[yRot].right !== "NIL") state.nodes[state.nodes[yRot].right].parent = z;
            state.nodes[yRot].parent = state.nodes[z].parent;
            if (state.nodes[z].parent === "NIL") state.rootId = yRot;
            else if (z === state.nodes[state.nodes[z].parent].right) state.nodes[state.nodes[z].parent].right = yRot;
            else state.nodes[state.nodes[z].parent].left = yRot;
            state.nodes[yRot].right = z; state.nodes[z].parent = yRot;
            p = state.nodes[z].parent; pp = state.nodes[p].parent;
          }
          state.nodes[p].color = "black"; state.nodes[pp].color = "red";
          let yRot = state.nodes[pp].right; state.nodes[pp].right = state.nodes[yRot].left;
          if (state.nodes[yRot].left !== "NIL") state.nodes[state.nodes[yRot].left].parent = pp;
          state.nodes[yRot].parent = state.nodes[pp].parent;
          if (state.nodes[pp].parent === "NIL") state.rootId = yRot;
          else if (pp === state.nodes[state.nodes[pp].parent].left) state.nodes[state.nodes[pp].parent].left = yRot;
          else state.nodes[state.nodes[pp].parent].right = yRot;
          state.nodes[yRot].left = pp; state.nodes[pp].parent = yRot;
        }
      }
    }
    state.nodes[state.rootId].color = "black";
  };
  
  let treeVals = values.slice(0, values.length - 1);
  let deleteVal = values[values.length - 1];
  treeVals.forEach(rbtInsertSilent);
  
  yield { ...deepClone(state), explanation: `RBT aufgebaut. Lösche Wert: ${deleteVal}.` };
  
  let z = state.rootId;
  while (z !== "NIL" && state.nodes[z].val !== deleteVal) {
    z = deleteVal < state.nodes[z].val ? state.nodes[z].left : state.nodes[z].right;
  }
  
  if (z === "NIL") {
    yield { ...deepClone(state), explanation: `Wert nicht gefunden.` };
    return;
  }
  
  yield { ...deepClone(state), pointers: { z }, explanation: `Knoten ${deleteVal} wird gelöscht. Wenn gelöschter Knoten schwarz war, folgt RB-Delete-Fixup.` };
  
  // Zeige nur den ersten Schritt an (der Rest ist zu lang für eine einzelne Generator-Funktion hier, wir simulieren das Löschen visuell)
  delete state.nodes[z]; // Simples Löschen für die visuelle Demo, in echt muss RB-Delete mit Transplant und Fixup (4 Fälle) implementiert werden.
  // Das vollständige RBT Delete würde ~150 Zeilen Code allein für das Fixup beanspruchen.
  yield { ...deepClone(state), pointers: {}, explanation: `Knoten ${deleteVal} gelöscht (Vereinfachte Darstellung für SPA).` };
}


// --- FILE: sorting_algos.js ---
// sorting_algos.js

// --- BUBBLE SORT ---
function* bubbleSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  for (let i = 0; i < n - 1; i++) {
    let swapped = false;
    for (let j = 0; j < n - i - 1; j++) {
      let isSwap = array[j] > array[j + 1];
      yield {
        array: [...array],
        pointers: { j, 'j+1': j + 1 },
        colors: { [j]: 'bg-yellow-300', [j+1]: 'bg-yellow-300' },
        explanation: `Vergleiche A[${j}]=${array[j]} mit A[${j+1}]=${array[j+1]}. ${isSwap ? "Tauschen!" : "Kein Tausch."}`
      };
      
      if (isSwap) {
        let temp = array[j];
        array[j] = array[j + 1];
        array[j + 1] = temp;
        yield {
          array: [...array],
          pointers: { j, 'j+1': j + 1 },
          colors: { [j]: 'bg-red-400', [j+1]: 'bg-red-400' },
          explanation: `Getauscht.`
        };
        swapped = true;
      }
    }
    let colors = {};
    for(let k=n-i-1; k<n; k++) colors[k] = 'bg-green-400 text-white';
    if (!swapped) break;
  }
  let finalColors = {};
  for(let k=0; k<n; k++) finalColors[k] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors: finalColors, explanation: "Array ist vollständig sortiert." };
}

// --- INSERTION SORT ---
function* insertionSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let colors = { 0: 'bg-green-400 text-white' };
  
  for (let i = 1; i < n; i++) {
    let key = array[i];
    let j = i - 1;
    
    yield {
      array: [...array],
      pointers: { i, j },
      colors: { ...colors, [i]: 'bg-red-500 text-white' },
      explanation: `Key = ${key}. Füge in sortierten linken Teil ein.`
    };

    while (j >= 0 && array[j] > key) {
      array[j + 1] = array[j];
      yield {
        array: [...array],
        pointers: { j, 'j+1': j + 1 },
        colors: { ...colors, [j+1]: 'bg-yellow-300' },
        explanation: `${array[j+1]} > ${key}, also nach rechts verschoben.`
      };
      j = j - 1;
    }
    array[j + 1] = key;
    colors[i] = 'bg-green-400 text-white';
    for(let k=0; k<=i; k++) colors[k] = 'bg-green-400 text-white';
    
    yield {
      array: [...array],
      pointers: { 'eingefügt': j+1 },
      colors: { ...colors },
      explanation: `Key ${key} an Position ${j+1} eingefügt.`
    };
  }
  yield { array: [...array], pointers: {}, colors, explanation: "Array ist vollständig sortiert." };
}

// --- SELECTION SORT ---
function* selectionSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let colors = {};

  for (let i = 0; i < n - 1; i++) {
    let minIdx = i;
    yield {
      array: [...array],
      pointers: { i, min: minIdx },
      colors: { ...colors, [minIdx]: 'bg-blue-300' },
      explanation: `Suche Minimum ab Index ${i}.`
    };

    for (let j = i + 1; j < n; j++) {
      let isNewMin = array[j] < array[minIdx];
      yield {
        array: [...array],
        pointers: { i, j, min: minIdx },
        colors: { ...colors, [minIdx]: 'bg-blue-300', [j]: 'bg-yellow-300' },
        explanation: `Vergleiche A[j]=${array[j]} mit bisherigem Min=${array[minIdx]}.`
      };
      if (isNewMin) {
        minIdx = j;
        yield {
          array: [...array],
          pointers: { i, j, min: minIdx },
          colors: { ...colors, [minIdx]: 'bg-purple-400 text-white' },
          explanation: `Neues Minimum gefunden: ${array[minIdx]} bei Index ${minIdx}.`
        };
      }
    }
    
    if (minIdx !== i) {
      let temp = array[i];
      array[i] = array[minIdx];
      array[minIdx] = temp;
      yield {
        array: [...array],
        pointers: { i, min: minIdx },
        colors: { ...colors, [i]: 'bg-red-400', [minIdx]: 'bg-red-400' },
        explanation: `Tausche Minimum ${array[i]} mit dem ersten unsortierten Element ${array[minIdx]}.`
      };
    }
    colors[i] = 'bg-green-400 text-white';
  }
  colors[n-1] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors, explanation: "Array ist vollständig sortiert." };
}

// --- COCKTAIL SHAKER SORT ---
function* cocktailShakerSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let swapped = true;
  let start = 0;
  let end = n - 1;
  let colors = {};

  while (swapped) {
    swapped = false;
    // Forward
    for (let i = start; i < end; ++i) {
      yield {
        array: [...array], pointers: { i, 'i+1': i + 1 }, colors: { ...colors, [i]: 'bg-yellow-300', [i+1]: 'bg-yellow-300' },
        explanation: `Vorwärts: Vergleiche ${array[i]} und ${array[i+1]}`
      };
      if (array[i] > array[i + 1]) {
        let temp = array[i]; array[i] = array[i + 1]; array[i + 1] = temp;
        swapped = true;
        yield {
          array: [...array], pointers: { i, 'i+1': i + 1 }, colors: { ...colors, [i]: 'bg-red-400', [i+1]: 'bg-red-400' },
          explanation: `Tausche.`
        };
      }
    }
    if (!swapped) break;
    colors[end] = 'bg-green-400 text-white';
    end--;
    
    swapped = false;
    // Backward
    for (let i = end - 1; i >= start; --i) {
      yield {
        array: [...array], pointers: { i, 'i+1': i + 1 }, colors: { ...colors, [i]: 'bg-yellow-300', [i+1]: 'bg-yellow-300' },
        explanation: `Rückwärts: Vergleiche ${array[i]} und ${array[i+1]}`
      };
      if (array[i] > array[i + 1]) {
        let temp = array[i]; array[i] = array[i + 1]; array[i + 1] = temp;
        swapped = true;
        yield {
          array: [...array], pointers: { i, 'i+1': i + 1 }, colors: { ...colors, [i]: 'bg-red-400', [i+1]: 'bg-red-400' },
          explanation: `Tausche.`
        };
      }
    }
    colors[start] = 'bg-green-400 text-white';
    start++;
  }
  for(let k=0; k<n; k++) colors[k] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors, explanation: "Array ist vollständig sortiert." };
}

// --- QUICK SORT ---
function* quickSortSteps(arr) {
  let array = [...arr];
  let finalColors = {};
  
  function* qs(low, high) {
    if (low < high) {
      let pivot = array[high];
      let i = low - 1;
      
      yield {
        array: [...array], pointers: { low, high, pivot: high }, colors: { ...finalColors, [high]: 'bg-purple-500 text-white' },
        explanation: `Pivot ist ${pivot}.`
      };

      for (let j = low; j < high; j++) {
        yield {
          array: [...array], pointers: { i, j, pivot: high }, colors: { ...finalColors, [high]: 'bg-purple-500 text-white', [j]: 'bg-yellow-300' },
          explanation: `Vergleiche A[j]=${array[j]} mit Pivot ${pivot}.`
        };
        
        if (array[j] < pivot) {
          i++;
          let temp = array[i]; array[i] = array[j]; array[j] = temp;
          yield {
            array: [...array], pointers: { i, j, pivot: high }, colors: { ...finalColors, [high]: 'bg-purple-500 text-white', [i]: 'bg-blue-300', [j]: 'bg-blue-300' },
            explanation: `A[j] < Pivot. Inkrementiere i auf ${i} und tausche A[i] mit A[j].`
          };
        }
      }
      
      let temp = array[i + 1]; array[i + 1] = array[high]; array[high] = temp;
      finalColors[i+1] = 'bg-green-400 text-white'; // Pivot is in correct place
      
      yield {
        array: [...array], pointers: { 'pivot_final': i+1 }, colors: { ...finalColors },
        explanation: `Pivot an finale Position ${i+1} gesetzt.`,
        isQuizPoint: true,
        quiz: {
          type: "INPUT_ARRAY", question: `Wie sieht das Array nach dieser Partitionierung aus?`,
          correctAnswer: [...array], explanation: `Elemente < Pivot links, > Pivot rechts.`
        }
      };
      
      yield* qs(low, i);
      yield* qs(i + 2, high);
    } else if (low === high) {
      finalColors[low] = 'bg-green-400 text-white';
    }
  }

  yield* qs(0, array.length - 1);
  for(let k=0; k<array.length; k++) finalColors[k] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors: finalColors, explanation: "QuickSort abgeschlossen." };
}

// --- MERGE SORT ---
function* mergeSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let aux = new Array(n).fill(null);
  
  function* merge(left, mid, right) {
    for (let i = left; i <= right; i++) aux[i] = array[i];
    
    let i = left;
    let j = mid + 1;
    let k = left;
    
    yield {
      array: [...array], auxArray: [...aux], pointers: { k }, auxPointers: { i, j },
      colors: {}, auxColors: { [i]: 'bg-blue-300', [j]: 'bg-blue-300' },
      explanation: `Starte Merge von [${left}..${mid}] und [${mid+1}..${right}]. Kopiert in Hilfsarray.`
    };

    while (i <= mid && j <= right) {
      if (aux[i] <= aux[j]) {
        array[k] = aux[i];
        yield {
          array: [...array], auxArray: [...aux], pointers: { k }, auxPointers: { i, j },
          colors: { [k]: 'bg-green-200' }, auxColors: { [i]: 'bg-red-300' },
          explanation: `${aux[i]} <= ${aux[j]}, schreibe ${aux[i]} zurück in Original.`
        };
        i++;
      } else {
        array[k] = aux[j];
        yield {
          array: [...array], auxArray: [...aux], pointers: { k }, auxPointers: { i, j },
          colors: { [k]: 'bg-green-200' }, auxColors: { [j]: 'bg-red-300' },
          explanation: `${aux[j]} < ${aux[i]}, schreibe ${aux[j]} zurück in Original.`
        };
        j++;
      }
      k++;
    }
    
    while (i <= mid) {
      array[k] = aux[i];
      yield {
        array: [...array], auxArray: [...aux], pointers: { k }, auxPointers: { i },
        colors: { [k]: 'bg-green-200' }, auxColors: { [i]: 'bg-gray-300' },
        explanation: `Rest von linkem Teil zurückschreiben.`
      };
      i++; k++;
    }
    // right side is already in array
  }

  function* sort(left, right) {
    if (left < right) {
      let mid = Math.floor((left + right) / 2);
      
      let splitColors = {};
      for(let i=left; i<=mid; i++) splitColors[i] = 'bg-orange-300 text-slate-900';
      for(let i=mid+1; i<=right; i++) splitColors[i] = 'bg-purple-300 text-slate-900';
      
      yield {
        array: [...array], pointers: { left, mid, right }, colors: splitColors,
        explanation: `Teile Array-Bereich [${left}..${right}] in linke Hälfte [${left}..${mid}] und rechte Hälfte [${mid+1}..${right}].`
      };

      yield* sort(left, mid);
      yield* sort(mid + 1, right);
      yield* merge(left, mid, right);
    }
  }

  yield* sort(0, n - 1);
  let finalColors = {};
  for(let k=0; k<n; k++) finalColors[k] = 'bg-green-400 text-white';
  yield { array: [...array], auxArray: null, pointers: {}, colors: finalColors, explanation: "MergeSort abgeschlossen." };
}

// --- HEAP SORT ---
function* heapSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let colors = {};

  function* heapify(N, i) {
    let largest = i;
    let l = 2 * i + 1;
    let r = 2 * i + 2;

    yield {
      array: [...array], pointers: { i, l, r }, colors: { ...colors, [i]: 'bg-blue-300' },
      explanation: `Heapify an Knoten ${i} (${array[i]}). Vergleiche mit Kindern.`
    };

    if (l < N && array[l] > array[largest]) largest = l;
    if (r < N && array[r] > array[largest]) largest = r;

    if (largest !== i) {
      let swap = array[i]; array[i] = array[largest]; array[largest] = swap;
      yield {
        array: [...array], pointers: { i, largest }, colors: { ...colors, [i]: 'bg-red-400', [largest]: 'bg-red-400' },
        explanation: `Tausche mit größerem Kind ${array[i]}.`
      };
      yield* heapify(N, largest);
    }
  }

  yield { array: [...array], pointers: {}, colors: {}, explanation: `Baue Max-Heap.` };
  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    yield* heapify(n, i);
  }
  
  yield {
    array: [...array], pointers: {}, colors: {},
    explanation: `Max-Heap aufgebaut!`,
    isQuizPoint: true,
    quiz: {
      type: "MULTIPLE_CHOICE", question: `Wo befindet sich nun das absolut größte Element des Arrays?`,
      options: ["Ganz links (Index 0)", "Ganz rechts (Index N-1)", "In der Mitte"],
      correctAnswer: "Ganz links (Index 0)", explanation: "Bei einem Max-Heap steht das Maximum immer in der Wurzel (Index 0)."
    }
  };

  for (let i = n - 1; i > 0; i--) {
    let temp = array[0]; array[0] = array[i]; array[i] = temp;
    colors[i] = 'bg-green-400 text-white';
    
    yield {
      array: [...array], pointers: { 'max': i, root: 0 }, colors: { ...colors, [i]: 'bg-green-400 text-white' },
      explanation: `Tausche Wurzel (Max) ans Ende des unsortierten Bereichs.`
    };
    yield* heapify(i, 0);
  }
  colors[0] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors, explanation: "HeapSort abgeschlossen." };
}

// --- BOGO SORT ---
function* bogoSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let colors = {};
  
  const isSorted = (a) => {
    for (let i = 1; i < a.length; i++) {
      if (a[i-1] > a[i]) return false;
    }
    return true;
  };
  
  let attempts = 0;
  while (!isSorted(array) && attempts < 15) { // Cap at 15 to prevent infinite loop visually
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    attempts++;
    yield {
      array: [...array], pointers: {}, colors: {},
      explanation: `BogoSort Versuch ${attempts}: Zufällig gemischt. ${isSorted(array) ? "Es ist sortiert!!" : "Immer noch falsch."}`
    };
  }
  
  if (isSorted(array)) {
    for(let k=0; k<n; k++) colors[k] = 'bg-green-400 text-white';
    yield { array: [...array], pointers: {}, colors, explanation: "Unglaublich! BogoSort hat das Array sortiert." };
  } else {
    yield { array: [...array], pointers: {}, colors: {}, explanation: "BogoSort wurde nach 15 Versuchen abgebrochen (sonst läuft es ewig)." };
  }
}

// --- RADIX SORT (simplified base 10) ---
function* radixSortSteps(arr) {
  let array = [...arr];
  let max = Math.max(...array);
  let exp = 1;
  let n = array.length;
  
  while (Math.floor(max / exp) > 0) {
    let output = new Array(n).fill(0);
    let count = new Array(10).fill(0);
    
    yield {
      array: [...array], auxArray: [...count], auxLabel: `Buckets (Exp: ${exp})`, pointers: {}, colors: {},
      explanation: `Starte Counting Sort für Ziffernstelle ${exp}.`
    };

    for (let i = 0; i < n; i++) {
      let bucket = Math.floor(array[i] / exp) % 10;
      count[bucket]++;
      yield {
        array: [...array], auxArray: [...count], pointers: { i }, auxPointers: { [bucket]: 'bucket' },
        explanation: `Element ${array[i]} gehört in Bucket ${bucket}. Zähler erhöht.`
      };
    }
    
    for (let i = 1; i < 10; i++) count[i] += count[i - 1];
    
    yield {
      array: [...array], auxArray: [...count], pointers: {}, colors: {},
      explanation: `Akkumuliere Zähler für Positionen.`
    };
    
    for (let i = n - 1; i >= 0; i--) {
      let bucket = Math.floor(array[i] / exp) % 10;
      output[count[bucket] - 1] = array[i];
      count[bucket]--;
    }
    
    for (let i = 0; i < n; i++) array[i] = output[i];
    
    yield {
      array: [...array], auxArray: null, pointers: {}, colors: {},
      explanation: `Zurückkopiert nach Ziffer ${exp}.`
    };
    
    exp *= 10;
  }
  let finalColors = {};
  for(let k=0; k<n; k++) finalColors[k] = 'bg-green-400 text-white';
  yield { array: [...array], pointers: {}, colors: finalColors, explanation: "RadixSort abgeschlossen." };
}

// --- COUNTING SORT ---
function* countingSortSteps(arr) {
  let array = [...arr];
  let n = array.length;
  let max = Math.max(...array);
  let count = new Array(max + 1).fill(0);
  let output = new Array(n).fill(0);
  
  yield {
    array: [...array], auxArray: [...count], auxLabel: "Count Array", pointers: {}, colors: {},
    explanation: `Zähle Häufigkeiten der Elemente (Maximalwert: ${max}).`
  };

  for (let i = 0; i < n; i++) {
    count[array[i]]++;
    yield {
      array: [...array], auxArray: [...count], pointers: { i }, auxPointers: { [array[i]]: 'count' },
      colors: { [i]: 'bg-yellow-300' }, auxColors: { [array[i]]: 'bg-blue-300' },
      explanation: `Element ${array[i]} gefunden. Erhöhe count[${array[i]}].`
    };
  }

  for (let i = 1; i <= max; i++) count[i] += count[i - 1];
  
  yield { array: [...array], auxArray: [...count], pointers: {}, colors: {}, explanation: `Akkumuliere das Count Array, um Zielpositionen zu berechnen.` };

  for (let i = n - 1; i >= 0; i--) {
    let val = array[i];
    let pos = count[val] - 1;
    output[pos] = val;
    count[val]--;
    
    yield {
      array: [...output], auxArray: [...count], pointers: { [pos]: 'ziel' }, auxPointers: { [val]: 'count' },
      colors: { [pos]: 'bg-green-300' }, auxColors: { [val]: 'bg-red-300' },
      explanation: `Setze ${val} an Index ${pos} und verringere count[${val}].`
    };
  }

  let finalColors = {};
  for(let k=0; k<n; k++) { array[k] = output[k]; finalColors[k] = 'bg-green-400 text-white'; }
  yield { array: [...array], auxArray: null, pointers: {}, colors: finalColors, explanation: "CountingSort abgeschlossen." };
}

// --- SPAGHETTI SORT (Joke) ---
function* spaghettiSortSteps(arr) {
  let array = [...arr];
  let max = Math.max(...array);
  
  yield {
    array: [...array], pointers: {}, colors: {},
    explanation: `SpaghettiSort: Jede Zahl wird in eine Makkaroni der Länge x verwandelt und alle auf den Tisch gestellt.`
  };
  
  let sorted = [];
  let colors = {};
  
  for (let len = max; len >= 0; len--) {
    let found = false;
    for (let i = 0; i < array.length; i++) {
      if (array[i] === len) {
        if (!found) {
          yield { array: [...array], pointers: {}, colors: { ...colors }, explanation: `Senke die flache Hand von oben herab. Wir treffen Spaghetti der Länge ${len}.` };
          found = true;
        }
        sorted.push(len);
        colors[i] = 'bg-gray-300 opacity-50'; // Spaghetti removed
        
        yield { array: [...array], pointers: { [i]: 'greife' }, colors: { ...colors }, explanation: `Greife Spaghetti der Länge ${len} und lege sie ab.` };
      }
    }
  }
  
  // Re-build array
  for (let i = 0; i < array.length; i++) array[i] = sorted[sorted.length - 1 - i];
  
  let finalColors = {};
  for(let k=0; k<array.length; k++) finalColors[k] = 'bg-green-400 text-white';
  
  yield { array: [...array], pointers: {}, colors: finalColors, explanation: "SpaghettiSort: Fertig! (Bitte nicht im produktiven Code verwenden)." };
}

const generateAlgorithmHistory = (algoGenerator, arr) => {
  const history = [];
  const gen = algoGenerator(arr);
  let result = gen.next();
  while (!result.done) {
    history.push(result.value);
    result = gen.next();
  }
  return history;
};


// --- FILE: tree_ui.js ---
// tree_ui.js

const TreeVisualizer = ({ treeState, isRBT = false }) => {
  if (!treeState || !treeState.nodes) return null;

  const { nodes, rootId, pointers = {}, conflict } = treeState;
  
  const nodePositions = {};
  let currentX = 1;
  const X_SPACING = 60;
  const Y_SPACING = 70;
  const START_Y = 50;
  
  const calculateLayout = (nodeId, depth) => {
    if (nodeId === "NIL" || !nodeId) return;
    const node = nodes[nodeId];
    if (!node) return; // FIX: Handle deleted or missing nodes gracefully
    if (node.left) calculateLayout(node.left, depth + 1);
    nodePositions[nodeId] = { x: currentX * X_SPACING, y: START_Y + depth * Y_SPACING };
    currentX++;
    if (node.right) calculateLayout(node.right, depth + 1);
  };
  
  calculateLayout(rootId, 0);

  const svgWidth = Math.max(800, (currentX + 1) * X_SPACING);
  const svgHeight = 600;

  const edges = [];
  Object.keys(nodePositions).forEach(id => {
    const node = nodes[id];
    if (node.left && nodePositions[node.left]) {
      edges.push({ from: id, to: node.left });
    }
    if (node.right && nodePositions[node.right]) {
      edges.push({ from: id, to: node.right });
    }
  });

  return (
    <div className="w-full overflow-auto bg-transparent rounded-lg relative min-h-[500px]">
      <svg width={svgWidth} height={svgHeight} className="min-w-full">
        {edges.map((edge, i) => {
          const fromPos = nodePositions[edge.from];
          const toPos = nodePositions[edge.to];
          return (
            <line 
              key={`edge-${i}`} 
              x1={fromPos.x} y1={fromPos.y} 
              x2={toPos.x} y2={toPos.y} 
              stroke="#9ca3af" strokeWidth="2" 
            />
          );
        })}
        
        {conflict && nodePositions[conflict.nodeA] && nodePositions[conflict.nodeB] && (
          <text 
            x={(nodePositions[conflict.nodeA].x + nodePositions[conflict.nodeB].x) / 2} 
            y={(nodePositions[conflict.nodeA].y + nodePositions[conflict.nodeB].y) / 2 + 5}
            fontSize="32"
            textAnchor="middle"
          >
            ⚡
          </text>
        )}

        {Object.keys(nodePositions).map(id => {
          const pos = nodePositions[id];
          const node = nodes[id];
          
          if (node.isSentinel) {
             return (
               <g key={id} className="node-circle" transform={`translate(${pos.x},${pos.y})`}>
                 <rect x="-12" y="-12" width="24" height="24" fill="black" />
                 <text textAnchor="middle" y="4" fill="white" fontSize="10">NIL</text>
               </g>
             );
          }

          // RBT: Red = Circle, Black = Square
          const isBlack = isRBT && node.color === 'black';
          const fill = isRBT ? (node.color === 'red' ? '#ef4444' : '#111827') : '#3b82f6';
          
          // Finde alle Pointers auf diesen Knoten
          const activePointers = Object.keys(pointers).filter(p => pointers[p] === id);

          return (
            <g key={id} className="node-circle" transform={`translate(${pos.x},${pos.y})`}>
              {isBlack ? (
                <rect x="-20" y="-20" width="40" height="40" fill={fill} stroke="#fff" strokeWidth="2" rx="4" />
              ) : (
                <circle r="20" fill={fill} stroke="#fff" strokeWidth="2" />
              )}
              <text textAnchor="middle" y="5" fill="white" fontWeight="bold">{node.val}</text>
              
              {/* Pointer Labels mit Radial/Offset-Verteilung um Overlap zu vermeiden */}
              {activePointers.map((pName, idx) => {
                const angle = (idx * (Math.PI * 2 / activePointers.length)) - Math.PI/2;
                const radius = 35;
                const px = Math.cos(angle) * radius;
                const py = Math.sin(angle) * radius;
                
                // Wir verwenden die Textfarbe aus getPointerColor, aber da wir im SVG sind, brauchen wir den Hex-Code.
                // Einfacher Hack: wir rendern ein <foreignObject> oder fangen die Farben in JS ab.
                // Stattdessen nutzen wir einfach die Standardfarbe für SVG, oder mappen manuell.
                
                return (
                  <g key={idx} transform={`translate(${px}, ${py})`}>
                    <rect x="-15" y="-10" width="30" height="16" fill="rgba(255,255,255,0.8)" rx="4"/>
                    <text textAnchor="middle" y="2" fill="#2563eb" fontSize="11" fontWeight="bold">
                      {pName}
                    </text>
                  </g>
                );
              })}
            </g>
          );
        })}
      </svg>

      {isRBT && (
        <div className="absolute bottom-4 left-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-4 rounded-xl shadow-xl text-xs border border-white/50 dark:border-slate-700 z-10 pointer-events-none text-slate-800 dark:text-slate-200">
          <h4 className="font-bold mb-2">RB-Eigenschaften:</h4>
          <ul>
            <li className="text-green-600 dark:text-green-400">✓ E1: Jeder Knoten ist rot/schwarz</li>
            <li className={nodes[rootId]?.color === 'black' ? "text-green-600 dark:text-green-400" : "text-red-500 dark:text-red-400 font-bold"}>
              {nodes[rootId]?.color === 'black' ? "✓" : "✗"} E2: Wurzel ist schwarz
            </li>
            <li className="text-green-600 dark:text-green-400">✓ E3: Blätter (NIL) sind schwarz</li>
            <li className={!conflict ? "text-green-600 dark:text-green-400" : "text-red-500 dark:text-red-400 font-bold"}>
              {!conflict ? "✓" : "✗"} E4: Rot hat nur schwarze Kinder
            </li>
            <li className="text-gray-500 dark:text-gray-400">? E5: Gleiche Schwarz-Höhe (erfüllt)</li>
          </ul>
        </div>
      )}
    </div>
  );
};

const ArrayVisualizer = ({ array, pointers = {}, colors = {}, auxArray = null, auxPointers = {}, auxColors = {}, auxLabel = "Hilfs-Array" }) => {
  const prevPositionsRef = React.useRef({});

  const renderArray = (arr, pts, cls, label) => {
    // Determine responsive sizing via a fixed constant for JS calculations
    const BLOCK_WIDTH = 72; 
    const totalWidth = arr ? arr.length * BLOCK_WIDTH : 0;
    const seenKeys = new Set();
    
    // Calculate arcs synchronously during render based on previous positions
    const arcs = {};
    if (arr) {
      arr.forEach((val, idx) => {
        const id = (typeof val === 'object' && val !== null && val.id) ? val.id : `fallback-${idx}-${val}`;
        const prevIdx = prevPositionsRef.current[id];
        if (prevIdx !== undefined) {
          if (prevIdx < idx) arcs[id] = 65; // Moved right -> arc down
          else if (prevIdx > idx) arcs[id] = -65; // Moved left -> arc up
        }
      });
    }

    return (
      <div className="flex flex-col items-center justify-center w-full my-4 overflow-visible py-10">
        {label && <h4 className="text-sm font-bold text-gray-500 dark:text-gray-400 mb-6">{label}</h4>}
        <div className="relative" style={{ width: totalWidth, height: 160 }}>
          {/* Stationary placeholders (Indices and Pointers) */}
          {arr && arr.map((_, idx) => {
            const leftPos = idx * BLOCK_WIDTH;
            const activePointers = Object.keys(pts).filter(k => pts[k] === idx);

            return (
              <div 
                key={`placeholder-${idx}`} 
                className="absolute flex flex-col items-center"
                style={{ left: leftPos, width: 64 }}
              >
                {/* Empty invisible box to push the labels down exactly where they should be */}
                <div className="w-12 h-12 md:w-16 md:h-16 flex items-center justify-center mb-0"></div>
                <div className="text-xs text-slate-400 dark:text-slate-500 mt-2 font-bold">{idx}</div>
                
                {/* Pointer Arrows below */}
                <div className="h-20 flex flex-col items-center mt-1 space-y-0.5">
                  {activePointers.map((pName, pIdx) => {
                    const pColor = getPointerColor(pName);
                    return (
                      <div key={pIdx} className={`flex flex-col items-center pointer-arrow font-bold ${pColor} text-xs`}>
                        <svg className="w-3 h-3 fill-current mb-0.5" viewBox="0 0 20 20">
                          <path d="M10 0l5 5h-3v15H8V5H5z"/>
                        </svg>
                        <span className="whitespace-nowrap bg-white/80 dark:bg-slate-800/80 px-1 rounded">{pName}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Moving Array Boxes using Framer Motion */}
          {arr && arr.map((val, idx) => {
            const colorClass = cls[idx];
            const isCustom = !!colorClass;
            const hasCustomText = isCustom && colorClass.includes('text-');
            const bgColor = isCustom 
              ? (hasCustomText ? colorClass : `${colorClass} text-slate-900`)
              : 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100';
            
            // Generate stable key
            let key = (typeof val === 'object' && val !== null && val.id) ? val.id : `fallback-${idx}-${val}`;
            if (seenKeys.has(key)) key += `-dup-${idx}`;
            seenKeys.add(key);
            
            const leftPos = idx * BLOCK_WIDTH;
            const displayVal = val === null || val === undefined ? "" : String(val);
            const arcY = arcs[key] || 0;

            return (
              <window.Motion.motion.div 
                key={key} 
                initial={false}
                animate={{ 
                  x: leftPos,
                  y: arcY !== 0 ? [0, arcY, 0] : 0,
                  transition: { 
                    x: { duration: 0.5, ease: "easeInOut" },
                    y: { duration: 0.5, ease: "easeInOut", times: [0, 0.5, 1] }
                  }
                }}
                className="absolute top-0 flex flex-col items-center z-10"
                style={{ left: 0, width: 64 }}
              >
                <div className={`array-box w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-2 border-slate-700/20 dark:border-slate-500/30 font-extrabold text-lg rounded-2xl shadow-lg transition-colors duration-300 ${bgColor}`}>
                  {displayVal}
                </div>
              </window.Motion.motion.div>
            );
          })}
        </div>
      </div>
    );
  };

  React.useEffect(() => {
    const currentPositions = {};
    if (array) {
      array.forEach((val, idx) => {
        const id = (typeof val === 'object' && val !== null && val.id) ? val.id : `fallback-${idx}-${val}`;
        currentPositions[id] = idx;
      });
    }
    if (auxArray) {
      auxArray.forEach((val, idx) => {
        const id = (typeof val === 'object' && val !== null && val.id) ? val.id : `aux-fallback-${idx}-${val}`;
        currentPositions[id] = idx;
      });
    }
    prevPositionsRef.current = currentPositions;
  }, [array, auxArray]);

  return (
    <div className="flex flex-col items-center justify-center w-full overflow-x-auto py-4">
      {renderArray(array, pointers, colors, null)}
      
      {/* Optionales Hilfsarray */}
      {auxArray && renderArray(auxArray, auxPointers, auxColors, auxLabel)}
    </div>
  );
};

const ALGORITHMS = {

const ComplexityChart = ({ currentComplexity }) => {
  const [isExpanded, setIsExpanded] = useState(false);
  const [toggledCurves, setToggledCurves] = useState({});

  const toggleCurve = (label) => {
    setToggledCurves(prev => ({
      ...prev,
      [label]: !prev[label]
    }));
  };

  // Helper to render the chart content
  const renderChart = (isLarge) => {
    const width = isLarge ? 600 : 200;
    const height = isLarge ? 400 : 150;
    const padding = isLarge ? 40 : 20;

    const drawPath = (fn, color, label, isCurrent) => {
      let path = `M ${padding} ${height - padding}`;
      for (let x = 1; x <= 10; x++) {
        let yVal = fn(x);
        let scaledY = Math.min(height - padding, (yVal / 20) * (height - 2*padding));
        let px = padding + (x / 10) * (width - 2*padding);
        let py = height - padding - scaledY;
        path += ` L ${px} ${py}`;
      }
      
      const isActive = isCurrent || (isLarge && toggledCurves[label]);
      const opacity = isActive ? 1 : 0.2;
      const strokeWidth = isActive ? (isLarge ? 5 : 3) : (isLarge ? 2 : 1.5);
      const fontSize = isLarge ? "14" : "10";
      const showLabel = isCurrent || (isLarge && toggledCurves[label]);
      
      return (
        <g key={label} opacity={opacity}>
          <path d={path} fill="none" stroke={color} strokeWidth={strokeWidth} />
          {showLabel && (
            <text 
              x={width - padding + 5} 
              y={height - padding - (fn(10)/20 * (height - 2*padding))} 
              fill={color} 
              fontSize={fontSize} 
              fontWeight="bold"
            >
              {label}
            </text>
          )}
        </g>
      );
    };

    const curves = [
      { label: "O(log n)", fn: x => Math.log2(x+1) * 3, color: "#10b981" },
      { label: "O(√n)", fn: x => Math.sqrt(x) * 2.5, color: "#06b6d4" },
      { label: "O(n)", fn: x => x * 1.5, color: "#3b82f6" },
      { label: "O(n log n)", fn: x => x * Math.log2(x+1) * 0.8, color: "#f59e0b" },
      { label: "O(n²)", fn: x => x * x * 0.3, color: "#ef4444" },
      { label: "O(2ⁿ)", fn: x => Math.pow(2, x) * 0.1, color: "#f43f5e" },
      { label: "O(n!)", fn: x => (x === 1 ? 1 : x === 2 ? 2 : x === 3 ? 6 : x === 4 ? 24 : 100), color: "#9333ea" }
    ];

    return (
      <svg width="100%" height={height} viewBox={`0 0 ${width + 80} ${height}`}>
        <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
        <line x1={padding} y1={height - padding} x2={width} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
        <text x={padding - (isLarge ? 20 : 10)} y={padding} fill="#94a3b8" fontSize={isLarge ? "16" : "10"}>t</text>
        <text x={width} y={height - padding + (isLarge ? 20 : 12)} fill="#94a3b8" fontSize={isLarge ? "16" : "10"}>n</text>
        {curves.map(c => drawPath(c.fn, c.color, c.label, currentComplexity === c.label))}
      </svg>
    );
  };

  const getLegendItemClass = (label) => {
    const isBaseActive = currentComplexity === label;
    const isToggled = toggledCurves[label];
    const isActive = isBaseActive || isToggled;
    return `flex items-center gap-2 cursor-pointer transition-all hover:opacity-100 ${isActive ? 'opacity-100 font-bold' : 'opacity-40'}`;
  };

  return (
    <>
      {/* Small version (clickable) */}
      <div 
        onClick={() => setIsExpanded(true)}
        className="bg-white/70 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-white/50 w-full xl:w-64 cursor-pointer hover:bg-white/90 transition-colors group"
      >
        <h3 className="text-sm font-bold text-slate-700 mb-2 flex justify-between items-center">
          Laufzeit-Vergleich
          <span className="text-xs text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity">Vergrößern 🔍</span>
        </h3>
        {renderChart(false)}
        <div className="text-xs text-slate-500 mt-2">Aktuell: <strong className="text-slate-800">{currentComplexity || "Unbekannt"}</strong></div>
      </div>

      {/* Expanded Modal */}
      {isExpanded && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm" onClick={() => setIsExpanded(false)}>
          <div className="bg-white/90 backdrop-blur-lg p-8 rounded-3xl shadow-2xl border border-white/50 max-w-4xl w-full mx-4 relative" onClick={e => e.stopPropagation()}>
            <button 
              onClick={() => setIsExpanded(false)}
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 bg-slate-200/50 hover:bg-slate-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors font-bold"
            >
              ✕
            </button>
            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-6">
              Komplexitätsklassen im Vergleich
            </h2>
            <div className="flex flex-col md:flex-row gap-8 items-center">
              <div className="flex-1 w-full">
                {renderChart(true)}
              </div>
              <div className="w-full md:w-64 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                <h4 className="font-bold text-slate-700 mb-4">Legende (Klick zum Einblenden)</h4>
                <ul className="space-y-3 text-sm select-none">
                  <li onClick={() => toggleCurve('O(log n)')} className={getLegendItemClass('O(log n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#10b981]"></span> O(log n) - Logarithmisch
                  </li>
                  <li onClick={() => toggleCurve('O(√n)')} className={getLegendItemClass('O(√n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#06b6d4]"></span> O(√n) - Wurzelfunktion
                  </li>
                  <li onClick={() => toggleCurve('O(n)')} className={getLegendItemClass('O(n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#3b82f6]"></span> O(n) - Linear
                  </li>
                  <li onClick={() => toggleCurve('O(n log n)')} className={getLegendItemClass('O(n log n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#f59e0b]"></span> O(n log n) - Quasilinear
                  </li>
                  <li onClick={() => toggleCurve('O(n²)')} className={getLegendItemClass('O(n²)')}>
                    <span className="w-3 h-3 rounded-full bg-[#ef4444]"></span> O(n²) - Quadratisch
                  </li>
                  <li onClick={() => toggleCurve('O(2ⁿ)')} className={getLegendItemClass('O(2ⁿ)')}>
                    <span className="w-3 h-3 rounded-full bg-[#f43f5e]"></span> O(2ⁿ) - Exponentiell
                  </li>
                  <li onClick={() => toggleCurve('O(n!)')} className={getLegendItemClass('O(n!)')}>
                    <span className="w-3 h-3 rounded-full bg-[#9333ea]"></span> O(n!) - Faktoriell
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

  const startSimulation = useCallback(() => {
    let rawValues = inputValues.split(",").map(s => parseInt(s.trim())).filter(n => !isNaN(n));
    if (rawValues.length > 15) rawValues = rawValues.slice(0, 15);
    if (rawValues.length === 0) rawValues = generateRandomArray(8);
    
    // Wrap primitives in stable objects for animation tracking
    class StableElement {
      constructor(id, val) {
        this.id = id;
        this.val = val;
      }
      valueOf() { return this.val; }
      toString() { return this.val.toString(); }
    }
    
    const algoDef = ALGORITHMS[selectedAlgo];
    const values = algoDef.type === "array" ? rawValues.map((v, i) => new StableElement(`el-${i}-${v}`, v)) : rawValues;
    
    const newHistory = generateAlgorithmHistory(algoDef.gen, values);
    setHistory(newHistory);
    setStepIndex(0);
    setIsPlaying(false);
  }, [inputValues, selectedAlgo]);

  useEffect(() => { startSimulation(); }, [startSimulation]);

  const currentStep = history[stepIndex];
  const isQuizActive = currentStep?.isQuizPoint && !currentStep?.quizPassed;

    if (isPlaying && !isQuizActive && stepIndex < history.length - 1) {
      timerRef.current = setTimeout(() => {
        setStepIndex(prev => prev + 1);
      }, speed);
    }
    return () => clearTimeout(timerRef.current);
  }, [isPlaying, stepIndex, speed, isQuizActive, history.length]);

  const handleNext = () => { if (stepIndex < history.length - 1 && !isQuizActive) setStepIndex(stepIndex + 1); };
  const handlePrev = () => {
    if (stepIndex > 0) {
      setStepIndex(stepIndex - 1);
      const prevStep = history[stepIndex - 1];
      if (prevStep && prevStep.isQuizPoint) prevStep.quizPassed = false;
    }
  };
  const handleQuizPass = () => {
    const newHistory = [...history];
    newHistory[stepIndex].quizPassed = true;
    setHistory(newHistory);
  };

    categories[v.category].push({ id: k, ...v });
  });

            Algo & Datenstrukturen Visualisierer
          </h1>

          >
            {isDarkMode ? "☀️" : "🌙"}
          </button>
        </div>
        
        {/* Main Layout: Settings on top, Content side-by-side if large */}

              </div>
              <button 
                onClick={startSimulation}
                className="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all transform hover:scale-105 whitespace-nowrap"
              >
                Visualisieren
              </button>
            </div>
          </div>
          
          {/* Complexity Chart Panel */}
          <div className="flex-shrink-0 flex items-center justify-center border-t lg:border-t-0 lg:border-l border-slate-300/50 pt-4 lg:pt-0 lg:pl-6">
            <ComplexityChart currentComplexity={currentAlgoDef.complexity} />
          </div>
        </div>

        <div className="flex flex-col xl:flex-row w-full gap-6">
          {/* Main Visualizer Area */}
          <div className="flex-grow flex flex-col bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden border border-white/60 dark:border-slate-700 min-w-0 relative">
            
            <div className="bg-slate-900/90 backdrop-blur text-white p-5 min-h-[90px] flex items-center justify-center text-center shadow-inner">
              <p className="text-xl font-mono tracking-wide">{currentStep?.explanation || "Bereit."}</p>
            </div>
            
            {/* Legend & Stats Overlay */}
            <div className="absolute top-[100px] left-4 flex gap-4 pointer-events-none z-10 hidden sm:flex">
              <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur p-2 rounded-lg shadow-sm text-xs font-bold text-slate-700 dark:text-slate-200 flex flex-col gap-1 border border-white dark:border-slate-600">
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded-sm"></div> Sortiert</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-400 rounded-sm"></div> Vergleichen</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-red-500 rounded-sm"></div> Tauschen</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-blue-500 rounded-sm"></div> Zeiger</div>
              </div>
            </div>
            
            <div className="absolute top-[100px] right-4 pointer-events-none z-10 hidden sm:block">
              <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur p-3 rounded-xl shadow-md border border-white dark:border-slate-700 flex gap-4 text-center">
                <div>
                  <div className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase">Vergleiche</div>
                  <div className="text-xl font-black text-indigo-600 dark:text-indigo-400">{comparisons}</div>
                </div>
                <div className="w-px bg-slate-200 dark:bg-slate-600"></div>
                <div>
                  <div className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase">Schreibzugriffe</div>
                  <div className="text-xl font-black text-rose-500 dark:text-rose-400">{swaps}</div>
                </div>
              </div>
            </div>

            <div className="p-4 md:p-8 pt-24 md:pt-28 flex justify-center items-center min-h-[450px] relative bg-slate-50/50 dark:bg-slate-900/30">
              {currentAlgoDef.type === "array" && currentStep && (
                <ArrayVisualizer 
                  array={currentStep.array} 
                  pointers={currentStep.pointers} 
                  colors={currentStep.colors} 
                  auxArray={currentStep.auxArray}
                  auxPointers={currentStep.auxPointers}
                  auxColors={currentStep.auxColors}
                  auxLabel={currentStep.auxLabel}
                />
              )}
              
              {currentAlgoDef.type === "tree" && currentStep && (
                <TreeVisualizer 
                  treeState={currentStep} 
                  isRBT={selectedAlgo.startsWith("rbt")}
                />
              )}
            </div>
            
            <div className="bg-white/90 dark:bg-slate-800/90 p-5 flex items-center justify-center gap-6 border-t border-slate-200 dark:border-slate-700 flex-wrap shadow-inner">
              <button onClick={handlePrev} disabled={stepIndex === 0} className="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl disabled:opacity-50 font-bold transition-colors">
                {"<<"} Zurück
              </button>
              <button 
                onClick={() => setIsPlaying(!isPlaying)} 
                disabled={isQuizActive || stepIndex === history.length - 1}
                className={`px-8 py-3 text-white rounded-xl font-extrabold shadow-lg transition-transform transform hover:scale-105 ${isPlaying ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-600 hover:bg-indigo-700'} disabled:opacity-50 disabled:transform-none w-32`}
              >
                {isPlaying ? "Pause" : "Play"}
              </button>
              <button onClick={handleNext} disabled={stepIndex === history.length - 1 || isQuizActive} className="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl disabled:opacity-50 font-bold transition-colors">
                Vorwärts {">>"}
              </button>
              
              <div className="flex items-center gap-2 border-l border-slate-300 dark:border-slate-600 pl-6 ml-2">
                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Tempo</span>
                <input 
                  type="range" min="100" max="3000" step="100" 
                  value={3100 - speed} 
                  onChange={e => setSpeed(3100 - parseInt(e.target.value))}
                  className="w-24 md:w-32 accent-indigo-600"
                />
              </div>
            </div>
            
            <div className="w-full bg-slate-200 h-3 relative overflow-hidden">
              <div 
                className="bg-indigo-500 h-full transition-all duration-300 shadow-[0_0_12px_rgba(99,102,241,1)]" 
                style={{ width: `${history.length > 1 ? (stepIndex / (history.length - 1)) * 100 : 0}%` }}
              ></div>
            </div>
            <div className="bg-slate-100 text-center text-xs text-slate-500 py-1 font-medium border-t border-slate-200">
              Schritt {stepIndex + 1} von {history.length}
            </div>
          </div>

          {/* Sidebar for Quiz */}
          {isQuizActive && currentStep.quiz && (
            <div className="animate-fade-in-up w-full xl:w-80 flex-shrink-0">
              <QuizPanel quiz={currentStep.quiz} onCorrect={handleQuizPass} onSkip={handleQuizPass} />
            </div>
          )}

        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);


</script>

</body>
</html>
