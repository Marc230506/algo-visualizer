const ComplexityChart = ({ currentComplexity }) => {
  const [isExpanded, setIsExpanded] = useState(false);
  const [toggledCurves, setToggledCurves] = useState({});

  const toggleCurve = (label) => {
    setToggledCurves(prev => ({
      ...prev,
      [label]: !prev[label]
    }));
  };

  // Helper to render the chart content
  const renderChart = (isLarge) => {
    const width = isLarge ? 600 : 200;
    const height = isLarge ? 400 : 150;
    const padding = isLarge ? 40 : 20;

    const drawPath = (fn, color, label, isCurrent) => {
      let path = `M ${padding} ${height - padding}`;
      for (let x = 1; x <= 10; x++) {
        let yVal = fn(x);
        let scaledY = (yVal / 20) * (height - 2*padding);
        let px = padding + (x / 10) * (width - 2*padding);
        let py = height - padding - scaledY;
        path += ` L ${px} ${py}`;
      }
      
      const isActive = isCurrent || (isLarge && toggledCurves[label]);
      const opacity = isActive ? 1 : 0.2;
      const strokeWidth = isActive ? (isLarge ? 5 : 3) : (isLarge ? 2 : 1.5);
      const fontSize = isLarge ? "14" : "10";
      const showLabel = isCurrent || (isLarge && toggledCurves[label]);
      
      // Calculate label position (clamp to top of chart to remain visible)
      let labelY = height - padding - (fn(10)/20 * (height - 2*padding));
      if (labelY < padding) labelY = padding + 10;
      
      return (
        <g key={label} opacity={opacity}>
          <path d={path} fill="none" stroke={color} strokeWidth={strokeWidth} />
          {showLabel && (
            <text 
              x={width - padding + 5} 
              y={labelY} 
              fill={color} 
              fontSize={fontSize} 
              fontWeight="bold"
            >
              {label}
            </text>
          )}
        </g>
      );
    };

    const curves = [
      { label: "O(log n)", fn: x => Math.log2(x+1) * 3, color: "#10b981" },
      { label: "O(√n)", fn: x => Math.sqrt(x) * 2.5, color: "#06b6d4" },
      { label: "O(n)", fn: x => x * 1.5, color: "#3b82f6" },
      { label: "O(n log n)", fn: x => x * Math.log2(x+1) * 0.8, color: "#f59e0b" },
      { label: "O(n²)", fn: x => x * x * 0.3, color: "#ef4444" },
      { label: "O(2ⁿ)", fn: x => Math.pow(2, x) * 0.1, color: "#f43f5e" },
      { label: "O(n!)", fn: x => { let res = 1; for(let i=2; i<=x; i++) res*=i; return res * 0.05; }, color: "#9333ea" }
    ];

    return (
      <svg width="100%" height={height} viewBox={`0 0 ${width + 80} ${height}`} style={{ overflow: "hidden" }}>
        <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
        <line x1={padding} y1={height - padding} x2={width} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
        <text x={padding - (isLarge ? 20 : 10)} y={padding} fill="#94a3b8" fontSize={isLarge ? "16" : "10"}>t</text>
        <text x={width} y={height - padding + (isLarge ? 20 : 12)} fill="#94a3b8" fontSize={isLarge ? "16" : "10"}>n</text>
        {curves.map(c => drawPath(c.fn, c.color, c.label, currentComplexity === c.label))}
      </svg>
    );
  };

  const getLegendItemClass = (label) => {
    const isBaseActive = currentComplexity === label;
    const isToggled = toggledCurves[label];
    const isActive = isBaseActive || isToggled;
    return `flex items-center gap-2 cursor-pointer transition-all hover:opacity-100 ${isActive ? 'opacity-100 font-bold' : 'opacity-40'}`;
  };

  return (
    <>
      {/* Small version (clickable) */}
      <div 
        onClick={() => setIsExpanded(true)}
        className="bg-white/70 dark:bg-slate-800/70 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-white/50 dark:border-slate-700/50 w-full xl:w-64 cursor-pointer hover:bg-white/90 dark:hover:bg-slate-800/90 transition-colors group"
      >
        <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 flex justify-between items-center">
          Laufzeit-Vergleich
          <span className="text-xs text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity">Vergrößern 🔍</span>
        </h3>
        {renderChart(false)}
        <div className="text-xs text-slate-500 dark:text-slate-400 mt-2">Aktuell: <strong className="text-slate-800 dark:text-slate-200">{currentComplexity || "Unbekannt"}</strong></div>
      </div>

      {/* Expanded Modal */}
      {isExpanded && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm" onClick={() => setIsExpanded(false)}>
          <div className="bg-white/90 dark:bg-slate-800/95 backdrop-blur-lg p-8 rounded-3xl shadow-2xl border border-white/50 dark:border-slate-700/50 max-w-4xl w-full mx-4 relative" onClick={e => e.stopPropagation()}>
            <button 
              onClick={() => setIsExpanded(false)}
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 bg-slate-200/50 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center transition-colors font-bold"
            >
              ✕
            </button>
            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 mb-6">
              Komplexitätsklassen im Vergleich
            </h2>
            <div className="flex flex-col md:flex-row gap-8 items-center">
              <div className="flex-1 w-full">
                {renderChart(true)}
              </div>
              <div className="w-full md:w-64 bg-slate-50 dark:bg-slate-900/50 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/50">
                <h4 className="font-bold text-slate-700 dark:text-slate-300 mb-4">Legende (Klick zum Einblenden)</h4>
                <ul className="space-y-3 text-sm select-none text-slate-600 dark:text-slate-400">
                  <li onClick={() => toggleCurve('O(log n)')} className={getLegendItemClass('O(log n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#10b981]"></span> O(log n) - Logarithmisch
                  </li>
                  <li onClick={() => toggleCurve('O(√n)')} className={getLegendItemClass('O(√n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#06b6d4]"></span> O(√n) - Wurzelfunktion
                  </li>
                  <li onClick={() => toggleCurve('O(n)')} className={getLegendItemClass('O(n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#3b82f6]"></span> O(n) - Linear
                  </li>
                  <li onClick={() => toggleCurve('O(n log n)')} className={getLegendItemClass('O(n log n)')}>
                    <span className="w-3 h-3 rounded-full bg-[#f59e0b]"></span> O(n log n) - Quasilinear
                  </li>
                  <li onClick={() => toggleCurve('O(n²)')} className={getLegendItemClass('O(n²)')}>
                    <span className="w-3 h-3 rounded-full bg-[#ef4444]"></span> O(n²) - Quadratisch
                  </li>
                  <li onClick={() => toggleCurve('O(2ⁿ)')} className={getLegendItemClass('O(2ⁿ)')}>
                    <span className="w-3 h-3 rounded-full bg-[#f43f5e]"></span> O(2ⁿ) - Exponentiell
                  </li>
                  <li onClick={() => toggleCurve('O(n!)')} className={getLegendItemClass('O(n!)')}>
                    <span className="w-3 h-3 rounded-full bg-[#9333ea]"></span> O(n!) - Faktoriell
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

const App = () => {
  const [selectedAlgo, setSelectedAlgo] = useState("bubble");
  const [inputValues, setInputValues] = useState("8, 3, 5, 4, 7, 6, 1, 2");
  const [history, setHistory] = useState([]);
  const [stepIndex, setStepIndex] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [speed, setSpeed] = useState(1500);
  const [isDarkMode, setIsDarkMode] = useState(true);
  
  useEffect(() => {
    if (isDarkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [isDarkMode]);
  
  const timerRef = useRef(null);
  const [graphInput, setGraphInput] = useState("A-B:4, A-C:2, B-C:1, B-D:5, C-D:8, C-E:10, D-E:2, D-F:6, E-F:3");
  const [searchTarget, setSearchTarget] = useState("30");
  const [viewMode, setViewMode] = useState("boxes"); // "boxes" or "bars"
  const [heapType, setHeapType] = useState("max"); // "max" or "min"

  const [inputError, setInputError] = useState("");
  const [isMuted, setIsMuted] = useState(true);
  const audioCtxRef = useRef(null);

  const playSound = useCallback((val, options = {}) => {
    if (isMuted) return;
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      
      let numVal = 50;
      if (typeof val === 'number') numVal = val;
      else if (val && typeof val.val === 'number') numVal = val.val;
      
      const freq = options.freq || Math.min(Math.max(200 + (numVal * 15), 100), 2000);
      
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.type = options.type || 'sine';
      
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      
      const duration = options.duration || 0.1;
      const volume = options.volume !== undefined ? options.volume : 0.05;
      
      osc.start();
      gainNode.gain.setValueAtTime(volume, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    } catch (e) {
      console.warn("AudioContext failed", e);
    }
  }, [isMuted]);
  
  const startSimulation = useCallback(() => {
    const algoDef = ALGORITHMS[selectedAlgo];
    let values;

    if (algoDef.type === "graph") {
      // Parse simple graph input: "A-B:4, B-C:2"
      const edges = [];
      const nodes = new Set();
      graphInput.split(',').forEach(pair => {
        const parts = pair.trim().split(':');
        const weight = parts.length > 1 ? parseInt(parts[1]) : 1;
        const nodesStr = parts[0].split('-');
        if (nodesStr.length === 2) {
          nodes.add(nodesStr[0].trim());
          nodes.add(nodesStr[1].trim());
          edges.push({ u: nodesStr[0].trim(), v: nodesStr[1].trim(), weight: isNaN(weight) ? 1 : weight });
        }
      });
      values = { nodes: Array.from(nodes), edges };
      setInputError("");
    } else {
      let rawStrings = inputValues.split(",").map(s => s.trim()).filter(s => s.length > 0);
      if (rawStrings.length === 0) {
        setInputError("Bitte gib mindestens eine Zahl ein.");
        return;
      }
      let rawValues = rawStrings.map(s => parseInt(s));
      if (rawValues.some(isNaN)) {
        setInputError("Ungültige Eingabe: Bitte nur ganze Zahlen eingeben (kommagetrennt).");
        return;
      }
      if (rawValues.length > 15) {
        setInputError("Warnung: Maximal 15 Zahlen für eine saubere Visualisierung empfohlen. Werte wurden abgeschnitten.");
        rawValues = rawValues.slice(0, 15);
      } else {
        setInputError("");
      }
      
      if (algoDef.name.includes("Search") || algoDef.name.includes("Suche")) {
        const sVal = parseInt(searchTarget.trim());
        rawValues.push(isNaN(sVal) ? rawValues[Math.floor(rawValues.length/2)] : sVal);
      }
      
      class StableElement {
        constructor(id, val) {
          this.id = id;
          this.val = val;
        }
        valueOf() { return this.val; }
        toString() { return this.val.toString(); }
      }
      
      values = algoDef.type === "array" ? rawValues.map((v, i) => new StableElement(`el-${i}-${v}`, v)) : rawValues;
    }
    
    const genResult = typeof algoDef.gen === "function" 
        ? generateAlgorithmHistory(algoDef.gen, values, { heapType })
        : [];
      
    setHistory(genResult);
    setStepIndex(0);
    setIsPlaying(false);
  }, [inputValues, graphInput, searchTarget, selectedAlgo, heapType]);

  useEffect(() => { startSimulation(); }, [startSimulation]);

  const generateHeapTreeState = (step) => {
    if (!step || !step.array) return null;
    const array = step.array;
    const n = array.length;
    if (n === 0) return null;
    
    const nodes = {};
    for (let i = 0; i < n; i++) {
      const el = array[i];
      const val = typeof el === 'object' && el !== null ? el.val : el;
      const id = String(i);
      nodes[id] = { val };
      if (2 * i + 1 < n) nodes[id].left = String(2 * i + 1);
      if (2 * i + 2 < n) nodes[id].right = String(2 * i + 2);
    }
    
    const treePointers = {};
    if (step.pointers) {
      for (const [pName, idx] of Object.entries(step.pointers)) {
         if (idx >= 0 && idx < n) {
           treePointers[pName] = String(idx);
         }
      }
    }
    
    return { nodes, rootId: "0", pointers: treePointers };
  };

  const currentStep = history[stepIndex];
  const isQuizActive = currentStep?.isQuizPoint && !currentStep?.quizPassed;

  const handleNext = useCallback(() => { 
    if (stepIndex < history.length - 1 && !isQuizActive) setStepIndex(stepIndex + 1); 
  }, [stepIndex, history.length, isQuizActive]);
  
  const handlePrev = useCallback(() => {
    if (stepIndex > 0) {
      setStepIndex(stepIndex - 1);
      const prevStep = history[stepIndex - 1];
      if (prevStep && prevStep.isQuizPoint) prevStep.quizPassed = false;
    }
  }, [stepIndex, history]);

  useEffect(() => {
    if (isPlaying && !isQuizActive && stepIndex < history.length - 1) {
      const isSweep = currentStep?.isFastSweep;
      const delay = isSweep ? 50 : speed;
      timerRef.current = setTimeout(() => {
        handleNext();
      }, delay);
    }
    return () => clearTimeout(timerRef.current);
  }, [isPlaying, stepIndex, speed, isQuizActive, history.length, handleNext, currentStep]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isQuizActive && stepIndex < history.length - 1) {
          setIsPlaying(prev => !prev);
        }
      }
      else if (e.key === 'ArrowRight') handleNext();
      else if (e.key === 'ArrowLeft') handlePrev();
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [handleNext, handlePrev, isQuizActive, stepIndex, history.length]);

  useEffect(() => {
    if (!isMuted && currentStep) {
      if (currentStep.isFinalPling && currentStep.array && currentStep.array.length > 0) {
        const lastVal = currentStep.array[currentStep.array.length - 1];
        let numVal = 50;
        if (typeof lastVal === 'number') numVal = lastVal;
        else if (lastVal && typeof lastVal.val === 'number') numVal = lastVal.val;
        
        const lastFreq = Math.min(Math.max(200 + (numVal * 15), 100), 2000);
        playSound(null, { freq: lastFreq * 2, type: 'sine', duration: 0.8, volume: 0.05 }); 
      } else if (currentStep.colors && currentStep.array) {
        if (currentStep.isFastSweep && currentStep.sweepIndex !== undefined) {
          playSound(currentStep.array[currentStep.sweepIndex]);
        } else {
          const coloredKeys = Object.keys(currentStep.colors);
          if (coloredKeys.length > 0) {
            // Play sound for the active modified element, ignoring already sorted green elements
            const activeKey = coloredKeys.find(k => !currentStep.colors[k].includes('bg-green')) || coloredKeys[0];
            if (currentStep.array[activeKey] !== undefined) {
              playSound(currentStep.array[activeKey]);
            }
          }
        }
      }
    }
  }, [stepIndex, currentStep, isMuted, playSound]);

  const handleQuizPass = () => {
    const newHistory = [...history];
    newHistory[stepIndex].quizPassed = true;
    setHistory(newHistory);
  };

  const currentAlgoDef = ALGORITHMS[selectedAlgo];

  const categories = {};
  Object.entries(ALGORITHMS).forEach(([k, v]) => {
    if (!categories[v.category]) categories[v.category] = [];
    categories[v.category].push({ id: k, ...v });
  });

  const getStats = () => {
    let comps = 0;
    let swps = 0;
    for (let i = 0; i <= stepIndex; i++) {
      const s = history[i];
      if (s) {
        if (s.explanation?.includes("Vergleiche") || s.explanation?.includes("ist") || s.explanation?.includes("Heapify") || s.explanation?.includes("Prüfe")) comps++;
        if (s.explanation?.includes("Tausche") || s.explanation?.includes("Kopiert") || s.explanation?.includes("eingefügt")) swps++;
      }
    }
    return { comparisons: comps, swaps: swps };
  };

  const { comparisons, swaps } = getStats();

  return (
    <div className="min-h-screen flex flex-col items-center py-8 px-4 w-full bg-gradient-to-br from-slate-200 to-gray-300 dark:from-slate-900 dark:to-slate-800 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-500">
      <div className="max-w-7xl w-full">
        <div className="flex justify-between items-center mb-8 gap-4">
          <h1 className="text-4xl font-extrabold text-blue-600 dark:text-blue-400 drop-shadow-sm">
            Algo & Datenstrukturen Visualisierer
          </h1>
          <div className="flex gap-2">
            <button 
              onClick={() => setIsMuted(!isMuted)}
              className="p-3 rounded-full bg-white/50 dark:bg-slate-800/50 shadow hover:bg-white dark:hover:bg-slate-700 transition-colors"
              title={isMuted ? "Sound einschalten" : "Sound ausschalten"}
            >
              {isMuted ? "🔇" : "🔊"}
            </button>
            <button 
              onClick={() => setIsDarkMode(!isDarkMode)}
              className="p-3 rounded-full bg-white/50 dark:bg-slate-800/50 shadow hover:bg-white dark:hover:bg-slate-700 transition-colors"
              title="Dark Mode Toggle"
            >
              {isDarkMode ? "☀️" : "🌙"}
            </button>
          </div>
        </div>
        
        {/* Main Layout: Settings on top, Content side-by-side if large */}
        <div className="bg-white/70 dark:bg-slate-800/70 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white/50 dark:border-slate-700 w-full mb-8 flex flex-col lg:flex-row gap-6">
          <div className="flex-grow flex flex-col gap-4">
            <div>
              <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Algorithmus wählen:</label>
              <div className="flex flex-wrap gap-2">
                {Object.keys(categories).map(catName => (
                  <div key={catName} className="flex flex-col border border-white/40 dark:border-slate-700/50 bg-white/40 dark:bg-slate-700/30 rounded-xl p-3 shadow-sm">
                    <span className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">{catName}</span>
                    <div className="flex gap-2 flex-wrap">
                      {categories[catName].map(algo => (
                        <button 
                          key={algo.id}
                          onClick={() => setSelectedAlgo(algo.id)}
                          className={`text-sm px-4 py-2 rounded-lg font-medium transition-all ${selectedAlgo === algo.id ? 'bg-indigo-600 text-white shadow-md transform scale-105' : 'bg-white/80 dark:bg-slate-700/80 text-slate-700 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-600 hover:shadow'}`}
                        >
                          {algo.name}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-4 items-end mt-2">
              {currentAlgoDef.type === "graph" ? (
                <div className="flex-grow">
                  <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Graphen-Kanten (Format A-B:4, C-D:2):</label>
                  <input 
                    type="text" 
                    value={graphInput}
                    onChange={(e) => setGraphInput(e.target.value)}
                    className="border border-slate-300 dark:border-slate-600 p-3 rounded-xl w-full focus:ring-2 focus:ring-indigo-500 bg-white/90 dark:bg-slate-700 dark:text-white shadow-inner"
                  />
                </div>
              ) : (
                <>
                  <div className="flex-grow">
                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Eingabewerte (kommagetrennt, max 15):</label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={inputValues}
                        onChange={(e) => setInputValues(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && startSimulation()}
                        className={`border ${inputError ? 'border-red-500' : 'border-slate-300 dark:border-slate-600'} p-3 rounded-xl w-full focus:ring-2 focus:ring-indigo-500 bg-white/90 dark:bg-slate-700 dark:text-white shadow-inner`}
                      />
                      <button 
                        onClick={() => {
                          const r = Array.from({length: Math.floor(Math.random() * 10) + 5}, () => Math.floor(Math.random() * 99) + 1);
                          setInputValues(r.join(", "));
                        }}
                        className="bg-slate-200 hover:bg-slate-300 dark:bg-slate-600 dark:hover:bg-slate-500 text-slate-700 dark:text-slate-200 px-4 rounded-xl font-bold transition-colors whitespace-nowrap shadow-sm"
                        title="Zufälliges Array generieren"
                      >
                        Zufall 🎲
                      </button>
                    </div>
                    {inputError && <p className="text-red-500 text-xs mt-1 font-bold">{inputError}</p>}
                  </div>
                  {(currentAlgoDef.name.includes("Search") || currentAlgoDef.name.includes("Suche")) && (
                    <div className="w-32">
                      <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Suchziel:</label>
                      <input 
                        type="text" 
                        value={searchTarget}
                        onChange={(e) => setSearchTarget(e.target.value)}
                        className="border border-slate-300 dark:border-slate-600 p-3 rounded-xl w-full focus:ring-2 focus:ring-indigo-500 bg-white/90 dark:bg-slate-700 dark:text-white shadow-inner"
                      />
                    </div>
                  )}
                </>
              )}
              <button 
                onClick={startSimulation}
                className="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all transform hover:scale-105 whitespace-nowrap"
              >
                Visualisieren
              </button>
            </div>
          </div>
          
          {/* Complexity Chart Panel */}
          <div className="flex-shrink-0 flex items-center justify-center border-t lg:border-t-0 lg:border-l border-slate-300/50 pt-4 lg:pt-0 lg:pl-6">
            <ComplexityChart currentComplexity={currentAlgoDef.complexity} />
          </div>
        </div>

        <div className="flex flex-col xl:flex-row w-full gap-6">
          {/* Main Visualizer Area */}
          <div className="flex-grow flex flex-col bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden border border-white/60 dark:border-slate-700 min-w-0 relative">
            
            <div className="bg-slate-900/90 backdrop-blur text-white p-5 min-h-[90px] flex items-center justify-center text-center shadow-inner relative">
              <p className="text-xl font-mono tracking-wide">{currentStep?.explanation || "Bereit."}</p>
              
              {/* Toggles */}
              <div className="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
                {selectedAlgo === "heap" && (
                  <button 
                    onClick={() => setHeapType(prev => prev === "max" ? "min" : "max")}
                    className="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-sm font-bold transition-colors flex items-center gap-2"
                  >
                    {heapType === "max" ? "📈 Max-Heap" : "📉 Min-Heap"}
                  </button>
                )}
                {currentAlgoDef.type === "array" && (
                  <button 
                    onClick={() => setViewMode(prev => prev === "boxes" ? "bars" : "boxes")}
                    className="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-sm font-bold transition-colors flex items-center gap-2"
                  >
                    {viewMode === "boxes" ? "📊 Balken" : "🔲 Boxen"}
                  </button>
                )}
              </div>
            </div>
            
            {/* Legend & Stats Overlay */}
            <div className="absolute top-[100px] left-4 flex gap-4 pointer-events-none z-10 hidden sm:flex">
              <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur p-2 rounded-lg shadow-sm text-xs font-bold text-slate-700 dark:text-slate-200 flex flex-col gap-1 border border-white dark:border-slate-600">
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded-sm"></div> Sortiert</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-400 rounded-sm"></div> Vergleichen</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-red-500 rounded-sm"></div> Tauschen</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-blue-500 rounded-sm"></div> Zeiger</div>
              </div>
            </div>
            
            <div className="absolute top-[100px] right-4 pointer-events-none z-10 hidden sm:block">
              <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur p-3 rounded-xl shadow-md border border-white dark:border-slate-700 flex gap-4 text-center">
                <div>
                  <div className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase">Laufzeit</div>
                  <div className="text-xl font-black text-emerald-600 dark:text-emerald-400">{currentAlgoDef.complexity}</div>
                </div>
                <div className="w-px bg-slate-200 dark:bg-slate-600"></div>
                <div>
                  <div className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase">Vergleiche</div>
                  <div className="text-xl font-black text-indigo-600 dark:text-indigo-400">{comparisons}</div>
                </div>
                <div className="w-px bg-slate-200 dark:bg-slate-600"></div>
                <div>
                  <div className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase">Schreibzugriffe</div>
                  <div className="text-xl font-black text-rose-500 dark:text-rose-400">{swaps}</div>
                </div>
              </div>
            </div>

            <div className="p-4 md:p-8 pt-24 md:pt-28 flex justify-center items-center min-h-[450px] relative bg-slate-50/50 dark:bg-slate-900/30">
              {currentAlgoDef.type === "array" && currentStep && (
                <div className={`flex w-full items-center ${selectedAlgo === 'heap' ? 'flex-col 2xl:flex-row justify-center gap-8' : 'flex-col justify-center'}`}>
                  <div className={selectedAlgo === 'heap' ? "w-full 2xl:w-1/2 flex justify-center" : "w-full flex justify-center"}>
                    <ArrayVisualizer 
                      array={currentStep.array} 
                      pointers={currentStep.pointers} 
                      colors={currentStep.colors} 
                      auxArray={currentStep.auxArray}
                      auxPointers={currentStep.auxPointers}
                      auxColors={currentStep.auxColors}
                      auxLabel={currentStep.auxLabel}
                      viewMode={viewMode}
                    />
                  </div>
                  {selectedAlgo === "heap" && (
                    <div className="w-full 2xl:w-1/2 flex flex-col items-center border-t 2xl:border-t-0 2xl:border-l border-slate-300 dark:border-slate-700 pt-8 2xl:pt-0 2xl:pl-8">
                      <h3 className="text-center font-bold text-slate-500 mb-4 uppercase tracking-widest">Heap-Baum Ansicht</h3>
                      <TreeVisualizer treeState={generateHeapTreeState(currentStep)} isRBT={false} />
                    </div>
                  )}
                </div>
              )}
              
              {currentAlgoDef.type === "tree" && currentStep && (
                <TreeVisualizer 
                  treeState={currentStep} 
                  isRBT={selectedAlgo.startsWith("rbt")}
                />
              )}

              {currentAlgoDef.type === "graph" && currentStep && (
                <GraphVisualizer 
                  graphState={currentStep} 
                />
              )}
            </div>
            
            <div className="bg-white/90 dark:bg-slate-800/90 p-5 flex items-center justify-center gap-6 border-t border-slate-200 dark:border-slate-700 flex-wrap shadow-inner">
              <button onClick={handlePrev} disabled={stepIndex === 0} className="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl disabled:opacity-50 font-bold transition-colors">
                {"<<"} Zurück
              </button>
              <button 
                onClick={() => setIsPlaying(!isPlaying)} 
                disabled={isQuizActive || stepIndex === history.length - 1}
                className={`px-8 py-3 text-white rounded-xl font-extrabold shadow-lg transition-transform transform hover:scale-105 ${isPlaying ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-600 hover:bg-indigo-700'} disabled:opacity-50 disabled:transform-none w-32`}
              >
                {isPlaying ? "Pause" : "Play"}
              </button>
              <button onClick={handleNext} disabled={stepIndex === history.length - 1 || isQuizActive} className="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl disabled:opacity-50 font-bold transition-colors">
                Vorwärts {">>"}
              </button>
              
              <div className="flex items-center gap-2 border-l border-slate-300 dark:border-slate-600 pl-6 ml-2">
                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase w-12 text-right">
                  {speed > 0 ? (1000 / speed).toFixed(1) : "MAX"}x
                </span>
                <input 
                  type="range" min="100" max="3000" step="100" 
                  value={3100 - speed} 
                  onChange={e => setSpeed(3100 - parseInt(e.target.value))}
                  className="w-24 md:w-32 accent-indigo-600"
                />
              </div>
            </div>
            
            <div className="w-full bg-slate-200 h-3 relative overflow-hidden">
              <div 
                className="bg-indigo-500 h-full transition-all duration-300 shadow-[0_0_12px_rgba(99,102,241,1)]" 
                style={{ width: `${history.length > 1 ? (stepIndex / (history.length - 1)) * 100 : 0}%` }}
              ></div>
            </div>
            <div className="bg-slate-100 text-center text-xs text-slate-500 py-1 font-medium border-t border-slate-200">
              Schritt {stepIndex + 1} von {history.length}
            </div>
          </div>

          {/* Sidebar for Quiz */}
          {isQuizActive && currentStep.quiz && (
            <div className="animate-fade-in-up w-full xl:w-80 flex-shrink-0">
              <QuizPanel quiz={currentStep.quiz} onCorrect={handleQuizPass} onSkip={handleQuizPass} />
            </div>
          )}

        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);


</script>

</body>
</html>
